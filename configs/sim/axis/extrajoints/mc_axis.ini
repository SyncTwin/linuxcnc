# The extra joint 4 is managed by an mc_axis component (PLCopen axis)
# after homing, instead of limit3 as in 1extrajoint.ini.
# Home all, then use the sim_pin buttons: position + execute moves,
# halt stops the move, reset leaves an error.

[EMC]
MACHINE = mc_axis
VERSION = 1.1

[APPLICATIONS]
APP = sim_pin --title "j4 mc_axis" \
      j4.position \
      j4.velocity \
      j4.mode \
      j4.execute/mode=pulse \
      j4.halt/mode=pulse \
      j4.reset/mode=pulse

[KINS]
JOINTS = 5
# NOTE: 4 kinematic joints + 1 extra (motmod) total=5
KINEMATICS = trivkins coordinates=XYYZ kinstype=both

[EMCMOT]
EMCMOT       = motmod num_extrajoints=1
SERVO_PERIOD = 1000000

[HAL]
HALFILE = mc_axis.hal
HALUI   = halui


[DISPLAY]
DISPLAY = axis
MAX_LINEAR_VELOCITY = 1
PROGRAM_PREFIX = .

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = sim.var

[TRAJ]
COORDINATES = XYYZ
LINEAR_UNITS = inch
ANGULAR_UNITS = degree

[JOINT_0]
TYPE = LINEAR
HOME_SEQUENCE     =   1
MAX_VELOCITY      =  10
MAX_ACCELERATION  = 100

[JOINT_1]
TYPE = LINEAR
HOME_SEQUENCE     =  -2
MAX_VELOCITY      =  10
MAX_ACCELERATION  = 100

[JOINT_2]
TYPE = LINEAR
HOME_SEQUENCE     =  -2
MAX_VELOCITY      =  10
MAX_ACCELERATION  = 100

[JOINT_3]
TYPE = LINEAR
HOME_SEQUENCE     =   3
MAX_VELOCITY      =  10
MAX_ACCELERATION  = 100

[JOINT_4]
# this 'extra' joint is managed by an
# mc_axis component after homing
TYPE = LINEAR
HOME_SEQUENCE     =   0
MIN_LIMIT         = -10
MAX_LIMIT         =  10
MAX_VELOCITY      =   5
MAX_ACCELERATION  = 100
# following error that puts the mc_axis into ErrorStop
FERROR            =   0.5
